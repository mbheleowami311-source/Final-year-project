<!DOCTYPE html>
<lang ="en">
<head>
      <title>login-IPTMS</title>
      <link rel="Home.html" href="Home.html">
      <link rel="stylesheet" href="styles.css">
      <link rel="Rank M profile" href="RankProfile.html">
</head>
<body>
<div class="authentication">
    <h1>Welcome back</h1>
    <p class="subheader">Log in to your accoount</p>
    

<form  class="Details" id= "loginForm" method="post">
     <label for="Email"> Email: </label>
     <input type="text"
      id="email"
       placeholder="surname@gmail.com" 
       name="email"
       required>
     <br><br>  
     <label for="password" > Password:</label>
     <input type="password" 
      name="password"
      id="password"
        required>

<br><br>  

<button type="Submit">Login</button>
</form>
<p class="switch-link"> Don't have an account?<a href="signin.html">Sign up</a></p>


<a href="Home.html" class="Back link">&larr; Back to home</a>

    <input type="email" id="email" placeholder="Email" required>

    <input type="password" id="password" placeholder="Password" required>

<script>

document.getElementById("loginForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const response = await fetch("http://127.0.0.1:8080/signInCommuter", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            email: email,
            password: password
        })

    });

    const data = await response.json();

    if (data.success) {

        window.location.href =
            "file:///home/nkanyiso-zungu/Desktop/Ntando's_Group/frontend/Update%20Location%202.html";

    } else {

        window.location.href =
            "file:///home/nkanyiso-zungu/Desktop/Ntando's_Group/frontend/login(IPTMS).html";


    }

});

</script>

</body>
</html>
